services:
  - type: web
    name: evidencedesk-api
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EVIDENCE_DESK_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://evidencedesk.vercel.app"
